# Web estática: se publica la raíz del repositorio sin compilar
[build]
  publish = "."

# Cabeceras de seguridad para todas las páginas.
# La política de contenido solo permite recursos de la propia web: si algún día
# se añade un servicio externo (analítica, reservas incrustadas...), hay que
# añadir su dominio aquí o dejará de funcionar.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; media-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Las fuentes no cambian nunca: se guardan en el navegador un año
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes y vídeos: un día. Si se sustituye un archivo con el mismo nombre,
# quien ya lo vio puede tardar hasta un día en ver el nuevo.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
